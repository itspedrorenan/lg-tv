<!DOCTYPE html>
<html lang="pt-BR">
<head>
<title>Launcher da Sala</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@200;400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: dashboard em duas colunas num palco fixo 1920x1080 escalado para a tela.
   Esquerda: saudação, relógio e o painel "Agora". Direita: apps e a lista de entradas.
   Alvo: Chromium 53 do webOS 4 — sem CSS grid, sem flex gap, só transform animado. */
:root {
  --bg: #0f1113;
  --panel: #16191c;
  --panel-hi: #1e2226;
  --line: #23272c;
  --text: #eceef0;
  --muted: #7b828b;
  --focus: #cddcf5;      /* anel de foco, azul-gelo */
  --ok: #5ccf96;         /* status: conectado / jogando */
  --font: "Onest", "LG Smart UI", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", "DejaVu Sans Mono", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
#viewport { position: relative; width: 100%; height: 100%; overflow: hidden; }
#stage {
  position: absolute; left: 0; top: 0;
  width: 1920px; height: 1080px;
  transform-origin: 0 0;
  padding: 84px 112px 72px;
  box-sizing: border-box;
  display: flex;
}

.label { font-size: 19px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }

/* coluna esquerda */
.side { width: 560px; margin-right: 64px; display: flex; flex-direction: column; flex-shrink: 0; }
.greeting { font-size: 30px; color: var(--muted); }
.clock { font-size: 196px; font-weight: 200; line-height: 1; letter-spacing: -6px; margin: 18px 0 0 -8px; font-variant-numeric: tabular-nums; }
.date { font-size: 30px; color: var(--muted); margin-top: 20px; }

.now { margin-top: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 28px; padding: 32px; }
.now-head { display: flex; align-items: center; justify-content: space-between; }
.now-state { font-size: 20px; color: var(--muted); display: flex; align-items: center; }
.now-body { display: flex; align-items: center; margin-top: 28px; }
.cover { width: 148px; height: 148px; border-radius: 18px; flex-shrink: 0; margin-right: 28px; background: var(--panel-hi); overflow: hidden; position: relative; }
.cover img { width: 100%; height: 100%; display: block; }
.cover-letter { position: absolute; left: 0; top: 0; width: 100%; height: 100%; line-height: 148px; text-align: center; font-size: 64px; font-weight: 200; color: var(--muted); }
.now-title { font-size: 40px; font-weight: 600; line-height: 1.15; max-height: 92px; overflow: hidden; }
.now-meta { font-size: 22px; color: var(--muted); margin-top: 10px; }
.now.is-idle .now-title { color: var(--muted); font-weight: 400; font-size: 34px; }

.dot { display: inline-block; width: 12px; height: 12px; border-radius: 6px; background: var(--line); margin-right: 12px; flex-shrink: 0; }
.dot.is-on { background: var(--ok); }

/* coluna direita */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.main .label { margin: 0 0 20px 4px; }
.group + .group { margin-top: 52px; }
.apps { display: flex; }

.tile {
  position: relative;
  box-sizing: border-box;
  background: var(--panel);
  border: 3px solid transparent;
  border-radius: 24px;
  cursor: pointer;
  outline: none;
  transition: transform .15s ease-out, background-color .15s;
  -webkit-transition: -webkit-transform .15s ease-out, background-color .15s;
}
.tile.is-focused { background: var(--panel-hi); border-color: var(--focus); transform: scale(1.03); -webkit-transform: scale(1.03); }

/* apps */
.app { width: 336px; height: 256px; margin-right: 32px; padding: 32px; display: flex; flex-direction: column; justify-content: space-between; }
.app:last-child { margin-right: 0; }
.mark { width: 64px; height: 64px; border-radius: 16px; line-height: 64px; text-align: center; font-size: 34px; font-weight: 600; color: #fff; }
.mark-netflix { background: #c2121b; }
.mark-globoplay { background: #e8335f; }
.mark-crunchyroll { background: #f47521; }
.app .name { font-size: 36px; font-weight: 600; }
.app .kind { font-size: 22px; color: var(--muted); margin-top: 6px; }

/* entradas */
.input { height: 116px; padding: 0 36px 0 28px; margin-bottom: 16px; display: flex; align-items: center; }
.input:last-child { margin-bottom: 0; }
.device-logo { width: 104px; height: 52px; margin-right: 28px; flex-shrink: 0; }
.input.is-empty .device-logo { opacity: .35; }
.input-text { flex: 1; min-width: 0; }
.input .kind { font-size: 30px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.input.is-empty .kind { color: var(--muted); font-weight: 400; }
.input .name { font-family: var(--font-mono); font-size: 18px; color: var(--muted); margin-top: 4px; letter-spacing: 1px; }
.status { display: flex; align-items: center; font-size: 21px; color: var(--muted); margin-left: 24px; white-space: nowrap; }

/* dicas do controle */
.hints { margin-top: auto; display: flex; align-items: center; font-size: 20px; color: var(--muted); }
.hint { display: flex; align-items: center; margin-right: 40px; }
.key { display: inline-block; height: 38px; line-height: 34px; padding: 0 12px; margin-right: 12px; border: 2px solid var(--line); border-radius: 10px; box-sizing: border-box; font-family: var(--font-mono); font-size: 16px; color: var(--text); }

/* aviso de abertura */
#toast {
  position: absolute; right: 112px; top: 84px;
  background: var(--text); color: var(--bg);
  font-size: 24px; font-weight: 600; padding: 18px 30px; border-radius: 16px;
  opacity: 0; transition: opacity .2s; -webkit-transition: opacity .2s;
  white-space: nowrap;
}
#toast.show { opacity: 1; }
#toast small { font-family: var(--font-mono); font-weight: 500; opacity: .55; margin-left: 12px; font-size: 18px; }

@media (prefers-reduced-motion: reduce) { .tile, #toast { transition: none; -webkit-transition: none; } }
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div class="side">
      <div class="greeting" id="greeting">Boa noite</div>
      <div class="clock" id="clock">20:00</div>
      <div class="date" id="date">sábado, 18 de outubro</div>

      <div class="now is-idle" id="now">
        <div class="now-head">
          <span class="label">Agora</span>
          <span class="now-state"><span class="dot" id="now-dot"></span><span id="now-state">Nada aberto</span></span>
        </div>
        <div class="now-body">
          <div class="cover"><div class="cover-letter" id="now-letter">–</div><img id="now-cover" alt="" hidden></div>
          <div>
            <div class="now-title" id="now-title">Nenhum jogo aberto</div>
            <div class="now-meta" id="now-meta">O jogo do PS5 aparece aqui</div>
          </div>
        </div>
      </div>
    </div>

    <div class="main">
      <div class="group">
        <div class="label">Assistir</div>
        <div class="apps" id="row-apps"></div>
      </div>

      <div class="group">
        <div class="label">Entradas</div>
        <div id="row-inputs"></div>
      </div>

      <div class="hints">
        <div class="hint"><span class="key">◀ ▲ ▼ ▶</span>navegar</div>
        <div class="hint"><span class="key">OK</span>abrir</div>
        <div class="hint" id="hint-sim" hidden><span class="key">1 2 3</span>simular aparelho</div>
      </div>
    </div>

    <div id="toast"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // IDs de app no webOS. Os marcados VERIFICAR devem ser confirmados na TV com:
  //   luna-send -n 1 -f luna://com.webos.applicationManager/listApps '{}' | grep '"id"'
  var ROWS = [
    {
      el: 'row-apps',
      items: [
        { id: 'netflix', name: 'Netflix', kind: 'Filmes e séries', css: 'app', mark: 'netflix', glyph: 'N' },
        { id: 'globoplay', name: 'Globoplay', kind: 'Novelas e TV Globo', css: 'app', mark: 'globoplay', glyph: 'g' }, // VERIFICAR
        { id: 'crunchyroll', name: 'Crunchyroll', kind: 'Anime', css: 'app', mark: 'crunchyroll', glyph: 'C' } // VERIFICAR
      ]
    },
    {
      el: 'row-inputs',
      items: [
        { id: 'com.webos.app.hdmi1', name: 'HDMI 1', css: 'input', input: 'HDMI_1' },
        { id: 'com.webos.app.hdmi2', name: 'HDMI 2', css: 'input', input: 'HDMI_2' },
        { id: 'com.webos.app.hdmi3', name: 'HDMI 3', css: 'input', input: 'HDMI_3' }
      ]
    }
  ];

  // Aparelhos reconhecidos nas entradas. O teste roda sobre os textos que a TV informa
  // da porta (nome CEC, rótulo, fabricante), ex.: "PS5", "Xbox Series X", "NintendoSwitch".
  var DEVICES = [
    { key: 'playstation', label: 'PlayStation', match: /playstation|\bps[345]\b|\bsie\b/i },
    { key: 'xbox', label: 'Xbox', match: /xbox/i },
    { key: 'nintendo', label: 'Nintendo Switch', match: /nintendo|switch/i }
  ];

  // Use se a TV não identificar sozinha um aparelho, ex.: { HDMI_2: 'xbox' }
  var OVERRIDES = {};

  function logoUrl(key) { return 'img/devices/' + (key || 'default') + '.svg'; }

  var KEY = { LEFT: 37, UP: 38, RIGHT: 39, DOWN: 40, ENTER: 13, BACK: 461 };
  var MONTHS = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  var DAYS = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];

  var onTV = typeof window.PalmServiceBridge !== 'undefined';
  var focus = { row: 0, col: 0 };
  var lastCol = []; // última coluna focada em cada linha
  var tiles = []; // tiles[row][col] -> elemento

  function $(id) { return document.getElementById(id); }

  function build() {
    for (var r = 0; r < ROWS.length; r++) {
      var rowEl = $(ROWS[r].el);
      tiles[r] = [];
      for (var c = 0; c < ROWS[r].items.length; c++) {
        var item = ROWS[r].items[c];
        var el = document.createElement('div');
        el.className = 'tile ' + item.css;
        el.setAttribute('tabindex', '-1');
        el.setAttribute('data-row', r);
        el.setAttribute('data-col', c);
        el.innerHTML = item.input
          ? '<img class="device-logo" alt=""><div class="input-text"><div class="kind"></div><div class="name">' + item.name + '</div></div>' +
            '<div class="status"><span class="dot"></span><span class="status-text"></span></div>'
          : '<div class="mark mark-' + item.mark + '">' + item.glyph + '</div><div><div class="name">' + item.name + '</div><div class="kind">' + item.kind + '</div></div>';
        el.addEventListener('mouseenter', onHover);
        el.addEventListener('click', onClick);
        rowEl.appendChild(el);
        tiles[r][c] = el;
      }
    }
  }

  function setFocus(row, col) {
    var prev = tiles[focus.row] && tiles[focus.row][focus.col];
    if (prev) prev.className = prev.className.replace(' is-focused', '');
    focus.row = row;
    focus.col = col;
    lastCol[row] = col;
    tiles[row][col].className += ' is-focused';
    try { localStorage.setItem('launcher.focus', row + ',' + col); } catch (e) {}
  }

  function center(el) {
    var r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  // Navegação espacial: vai para o bloco mais próximo na direção da seta.
  // Ao trocar de linha, volta para o último bloco focado nela.
  function move(dx, dy) {
    var from = center(tiles[focus.row][focus.col]);
    var best = null, bestScore = Infinity;
    for (var r = 0; r < tiles.length; r++) {
      for (var c = 0; c < tiles[r].length; c++) {
        if (r === focus.row && c === focus.col) continue;
        var to = center(tiles[r][c]);
        var main = dx ? (to.x - from.x) * dx : (to.y - from.y) * dy;
        if (main <= 1) continue;
        var cross = dx ? Math.abs(to.y - from.y) : Math.abs(to.x - from.x);
        var score = main + cross * 2;
        if (score < bestScore) { bestScore = score; best = { row: r, col: c }; }
      }
    }
    if (!best) return;
    if (best.row !== focus.row && lastCol[best.row] !== undefined && dy && ROWS[best.row].el === 'row-apps') best.col = lastCol[best.row];
    setFocus(best.row, best.col);
  }

  function launch(item) {
    if (onTV) {
      var bridge = new window.PalmServiceBridge();
      bridge.onservicecallback = function (msg) {
        var res = {};
        try { res = JSON.parse(msg); } catch (e) {}
        if (!res.returnValue) toast('Não abriu ' + item.name, res.errorText || item.id);
      };
      bridge.call('luna://com.webos.applicationManager/launch', JSON.stringify({ id: item.id }));
      toast('Abrindo ' + item.name);
    } else {
      toast('Na TV, abriria ' + item.name, item.id);
    }
  }

  // --- entradas HDMI ---

  function identify(dev) {
    if (OVERRIDES[dev.id]) return OVERRIDES[dev.id];
    var text = '';
    for (var k in dev) if (typeof dev[k] === 'string') text += ' ' + dev[k];
    for (var i = 0; i < DEVICES.length; i++) if (DEVICES[i].match.test(text)) return DEVICES[i].key;
    return null;
  }

  function deviceLabel(key) {
    for (var i = 0; i < DEVICES.length; i++) if (DEVICES[i].key === key) return DEVICES[i].label;
    return '';
  }

  var psGame = null; // jogo aberto no PS5, segundo a presença PSN: { name, icon }
  var psLastOnline = 0; // última vez que a PSN viu o PS5 online (ms)
  var lastDevices = [];

  // Última vez que cada entrada teve um aparelho ligado: { HDMI_1: { key: 'playstation', at: ms } }.
  // Só é registrado enquanto o launcher está aberto; para o PS5 a PSN completa.
  var lastOn = {};
  var persistLastOn = true;
  try { lastOn = JSON.parse(localStorage.getItem('launcher.lastOn')) || {}; } catch (e) {}

  function relativeTime(at) {
    var now = new Date(), d = new Date(at);
    var min = Math.floor((now - d) / 60000);
    if (min < 2) return 'há pouco';
    if (min < 60) return 'há ' + min + ' min';
    var midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    if (at >= midnight) return 'há ' + Math.floor(min / 60) + ' h';
    if (at >= midnight - 86400000) return 'ontem às ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    return 'em ' + d.getDate() + ' de ' + MONTHS[d.getMonth()];
  }

  // devices: lista no formato do serviço EIM, [{ id: 'HDMI_1', connected: true, deviceName: 'PS5', ... }]
  function renderInputs(devices) {
    lastDevices = devices;
    var byId = {};
    for (var i = 0; i < devices.length; i++) byId[devices[i].id] = devices[i];
    var row = ROWS[1].items;
    var psPort = null, psLastAt = 0, now = Date.now();
    for (var c = 0; c < row.length; c++) {
      var id = row[c].input;
      var dev = byId[id] || { id: id, connected: false };
      var key = dev.connected ? identify(dev) : null;
      if (dev.connected) lastOn[id] = { key: key, at: now };
      var seen = lastOn[id];
      var shownKey = dev.connected ? key : seen ? seen.key : null;
      var seenAt = seen ? seen.at : 0;
      if (shownKey === 'playstation' && psLastOnline > seenAt) seenAt = psLastOnline;
      if (shownKey === 'playstation') {
        if (!psPort) psPort = row[c].name;
        if (seenAt > psLastAt) psLastAt = seenAt;
      }
      var playing = key === 'playstation' && psGame;
      var el = tiles[1][c];
      el.querySelector('.device-logo').src = logoUrl(shownKey);
      el.querySelector('.kind').textContent = playing ? psGame.name
        : dev.connected ? (key ? deviceLabel(key) : 'Aparelho conectado')
        : seen ? (shownKey ? deviceLabel(shownKey) : 'Aparelho')
        : 'Nada conectado';
      el.querySelector('.status-text').textContent = playing ? 'Jogando'
        : dev.connected ? 'Ligado agora'
        : seen ? 'Ligado ' + relativeTime(seenAt)
        : 'Vazio';
      el.querySelector('.dot').className = dev.connected ? 'dot is-on' : 'dot';
      var cls = el.className.replace(' is-empty', '');
      el.className = dev.connected ? cls : cls + ' is-empty';
    }
    if (persistLastOn) { try { localStorage.setItem('launcher.lastOn', JSON.stringify(lastOn)); } catch (e) {} }
    renderNow(psPort, psLastAt);
  }

  // Painel "Agora": o jogo aberto no PS5, quando houver; senão, quando o PS5 foi ligado pela última vez.
  function renderNow(psPort, psLastAt) {
    var active = psGame && psPort;
    $('now').className = active ? 'now' : 'now is-idle';
    $('now-dot').className = active ? 'dot is-on' : 'dot';
    $('now-state').textContent = active ? 'Jogando' : 'Nada aberto';
    $('now-title').textContent = active ? psGame.name : 'Nenhum jogo aberto';
    $('now-meta').textContent = active ? 'PlayStation 5 · ' + psPort
      : psLastAt ? 'PS5 ligado ' + relativeTime(psLastAt)
      : 'O jogo do PS5 aparece aqui';
    $('now-letter').textContent = active ? psGame.name.charAt(0) : '–';
    var img = $('now-cover');
    if (active && psGame.icon) {
      if (img.getAttribute('src') !== psGame.icon) img.src = psGame.icon;
      img.hidden = false;
    } else {
      img.hidden = true;
    }
  }

  var inputBridge; // mantém a assinatura viva
  function watchInputs() {
    inputBridge = new window.PalmServiceBridge();
    inputBridge.onservicecallback = function (msg) {
      var res = {};
      try { res = JSON.parse(msg); } catch (e) {}
      if (res.devices) renderInputs(res.devices);
      else if (res.returnValue === false) console.log('EIM indisponível: ' + msg);
    };
    inputBridge.call('luna://com.webos.service.eim/getAllInputStatus', JSON.stringify({ subscribe: true }));
  }

  // Jogo aberto no PS5: pergunta ao serviço do launcher, que consulta a PSN.
  var presenceBridge;
  function pollPresence() {
    if (document.hidden) return;
    presenceBridge = new window.PalmServiceBridge();
    presenceBridge.onservicecallback = function (msg) {
      var res = {};
      try { res = JSON.parse(msg); } catch (e) {}
      if (!res.returnValue) console.log('PSN: ' + msg);
      var game = res.returnValue && res.game ? res.game : null;
      var seen = res.returnValue ? (res.online ? Date.now() : Date.parse(res.lastOnline) || 0) : psLastOnline;
      if ((game && game.name) !== (psGame && psGame.name) || seen !== psLastOnline) {
        psGame = game;
        psLastOnline = seen;
        renderInputs(lastDevices);
      }
    };
    presenceBridge.call('luna://com.pedrorenan.launcher.service/presence', '{}');
  }

  // Prévia no navegador: teclas 1, 2 e 3 trocam o aparelho simulado em cada entrada.
  var SIM_CYCLE = [
    { connected: true, deviceName: 'PS5' },
    { connected: true, deviceName: 'Xbox Series X' },
    { connected: true, deviceName: 'NintendoSwitch' },
    { connected: true, deviceName: 'Blu-ray Player' },
    { connected: false }
  ];
  var simState = [0, 4, 4];
  function renderSim() {
    var devices = [];
    for (var i = 0; i < simState.length; i++) {
      var d = SIM_CYCLE[simState[i]];
      devices.push({ id: ROWS[1].items[i].input, connected: d.connected, deviceName: d.deviceName || '' });
    }
    renderInputs(devices);
  }

  var toastTimer;
  function toast(text, detail) {
    var el = $('toast');
    el.innerHTML = text + (detail ? '<small>' + detail + '</small>' : '');
    el.className = 'show';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = ''; }, 2200);
  }

  function onHover(e) {
    var el = e.currentTarget;
    setFocus(+el.getAttribute('data-row'), +el.getAttribute('data-col'));
  }

  function onClick(e) {
    onHover(e);
    launch(ROWS[focus.row].items[focus.col]);
  }

  document.addEventListener('keydown', function (e) {
    switch (e.keyCode) {
      case KEY.LEFT: move(-1, 0); break;
      case KEY.RIGHT: move(1, 0); break;
      case KEY.UP: move(0, -1); break;
      case KEY.DOWN: move(0, 1); break;
      case KEY.ENTER: launch(ROWS[focus.row].items[focus.col]); break;
      case KEY.BACK: break; // o launcher é a raiz: Voltar não faz nada
      case 49: case 50: case 51:
        if (onTV) return;
        var p = e.keyCode - 49;
        simState[p] = (simState[p] + 1) % SIM_CYCLE.length;
        renderSim();
        break;
      default: return;
    }
    e.preventDefault();
  });

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function tick() {
    var d = new Date(), h = d.getHours();
    $('clock').textContent = pad(h) + ':' + pad(d.getMinutes());
    $('date').textContent = DAYS[d.getDay()] + ', ' + d.getDate() + ' de ' + MONTHS[d.getMonth()];
    $('greeting').textContent = h >= 5 && h < 12 ? 'Bom dia' : h >= 12 && h < 18 ? 'Boa tarde' : 'Boa noite';
    if (tiles[1]) renderInputs(lastDevices); // atualiza os "há N min"
  }

  function fit() {
    var vp = $('viewport');
    var w = vp.clientWidth, h = vp.clientHeight;
    var s = Math.min(w / 1920, h / 1080);
    var t = 'translate(' + (w - 1920 * s) / 2 + 'px,' + (h - 1080 * s) / 2 + 'px) scale(' + s + ')';
    $('stage').style.transform = t;
    $('stage').style.webkitTransform = t;
  }

  $('now-cover').addEventListener('error', function () { this.hidden = true; });

  build();
  var saved = null;
  try { saved = (localStorage.getItem('launcher.focus') || '').split(','); } catch (e) {}
  if (saved && tiles[+saved[0]] && tiles[+saved[0]][+saved[1]]) setFocus(+saved[0], +saved[1]);
  else setFocus(0, 0);
  renderInputs([]);
  if (onTV) {
    watchInputs();
    pollPresence();
    setInterval(pollPresence, 60000);
    document.addEventListener('visibilitychange', pollPresence);
  } else {
    // exemplos para a prévia, sem gravar no navegador
    psGame = { name: 'Astro Bot', icon: null };
    persistLastOn = false;
    var yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1); yesterday.setHours(21, 40, 0, 0);
    lastOn = { HDMI_2: { key: 'nintendo', at: yesterday.getTime() } };
    renderSim();
    $('hint-sim').hidden = false;
  }
  tick();
  setInterval(tick, 20000);
  fit();
  window.addEventListener('resize', fit);
})();
</script>
</body>
