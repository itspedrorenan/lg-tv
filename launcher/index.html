<!DOCTYPE html>
<html lang="pt-BR">
<head>
<title>Launcher da Sala</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@200;400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: dashboard em duas colunas num palco fixo 1920x1080 escalado para a tela.
   Esquerda: saudação, relógio e o painel "Agora". Direita: apps e a lista de entradas.
   Alvo: Chromium 53 do webOS 4 — sem CSS grid, sem flex gap, só transform animado. */
:root {
  --bg: #0f1113;
  --panel: #16191c;
  --panel-hi: #1e2226;
  --line: #23272c;
  --text: #eceef0;
  --muted: #7b828b;
  --focus: #cddcf5;      /* anel de foco, azul-gelo */
  --ok: #5ccf96;         /* status: conectado / jogando */
  --font: "Onest", "LG Smart UI", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", "DejaVu Sans Mono", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
#viewport { position: relative; width: 100%; height: 100%; overflow: hidden; }
#stage {
  position: absolute; left: 0; top: 0;
  width: 1920px; height: 1080px;
  transform-origin: 0 0;
  padding: 84px 112px 72px;
  box-sizing: border-box;
  display: flex;
}

.label { font-size: 19px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }

/* coluna esquerda */
.side { width: 560px; margin-right: 64px; display: flex; flex-direction: column; flex-shrink: 0; }
.greeting { font-size: 30px; color: var(--muted); }
.clock { font-size: 196px; font-weight: 200; line-height: 1; letter-spacing: -6px; margin: 18px 0 0 -8px; font-variant-numeric: tabular-nums; }
.date { font-size: 30px; color: var(--muted); margin-top: 20px; }

.now { margin-top: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 28px; padding: 32px; cursor: pointer; transition: background-color .15s, box-shadow .15s; -webkit-transition: background-color .15s, box-shadow .15s; }
.now.is-focused { background: var(--panel-hi); border-color: var(--focus); box-shadow: 0 0 0 2px var(--focus); }
.now.is-idle { cursor: default; }
.now-head { display: flex; align-items: center; justify-content: space-between; }
.now-state { font-size: 20px; color: var(--muted); display: flex; align-items: center; }
.now-body { display: flex; align-items: center; margin-top: 28px; }
.cover { width: 148px; height: 148px; border-radius: 18px; flex-shrink: 0; margin-right: 28px; background: var(--panel-hi); overflow: hidden; position: relative; }
.cover img { position: relative; width: 100%; height: 100%; display: block; }
.cover.is-logo img { padding: 40px 16px; box-sizing: border-box; } /* logo de console, mais largo que alto */
.cover.is-colored .cover-letter { color: #fff; font-weight: 600; }
.cover-letter { position: absolute; left: 0; top: 0; width: 100%; height: 100%; line-height: 148px; text-align: center; font-size: 64px; font-weight: 200; color: var(--muted); }
.now-title { font-size: 40px; font-weight: 600; line-height: 1.15; max-height: 92px; overflow: hidden; }
.now-meta { font-size: 22px; color: var(--muted); margin-top: 10px; }
.now.is-idle .now-title { color: var(--muted); font-weight: 400; font-size: 34px; }

.dot { display: inline-block; width: 12px; height: 12px; border-radius: 6px; background: var(--line); margin-right: 12px; flex-shrink: 0; }
.dot.is-on { background: var(--ok); }

/* coluna direita */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.main .label { margin: 0 0 20px 4px; }
.group + .group { margin-top: 28px; }
.inputs-group { flex: 1; min-height: 0; display: flex; flex-direction: column; } /* só as entradas rolam */
.apps { display: flex; flex-wrap: wrap; }

/* área que rola quando o conteúdo passa da altura da tela; as margens negativas
   deixam espaço para o anel de foco ampliado não ser cortado nas bordas */
.scroll { flex: 1; min-height: 0; overflow: hidden; position: relative; margin: -12px -24px 0; padding: 12px 24px 0; }
.scroll-inner { position: relative; transition: transform .2s ease-out; -webkit-transition: -webkit-transform .2s ease-out; }

.tile {
  position: relative;
  box-sizing: border-box;
  background: var(--panel);
  border: 3px solid transparent;
  border-radius: 24px;
  cursor: pointer;
  outline: none;
  transition: transform .15s ease-out, background-color .15s;
  -webkit-transition: -webkit-transform .15s ease-out, background-color .15s;
}
.tile.is-focused { background: var(--panel-hi); border-color: var(--focus); transform: scale(1.03); -webkit-transform: scale(1.03); }

/* apps */
.app { width: 250px; height: 200px; margin: 0 24px 24px 0; padding: 26px 28px; display: flex; flex-direction: column; justify-content: space-between; }
.app:nth-child(4n) { margin-right: 0; }
.mark { position: relative; width: 64px; height: 64px; border-radius: 16px; overflow: hidden; line-height: 64px; text-align: center; font-size: 34px; font-weight: 600; color: #fff; background: #3a4048; }
.mark img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.mark-netflix { background: #c2121b; }
.mark-globoplay { background: #e8335f; }
.mark-crunchyroll { background: #f47521; }
.mark-store { background: #3a4048; }
.app .name { font-size: 30px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.app .kind { font-size: 20px; color: var(--muted); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* entradas */
.input { height: 92px; padding: 0 36px 0 28px; margin-bottom: 12px; display: flex; align-items: center; }
.input:last-child { margin-bottom: 0; }
.device-logo { width: 104px; height: 52px; margin-right: 28px; flex-shrink: 0; }
.input.is-empty .device-logo { opacity: .35; }
.input-text { flex: 1; min-width: 0; }
.input .kind { font-size: 28px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.input.is-empty .kind { color: var(--muted); font-weight: 400; }
.input .name { font-family: var(--font-mono); font-size: 18px; color: var(--muted); margin-top: 4px; letter-spacing: 1px; }
.status { display: flex; align-items: center; font-size: 21px; color: var(--muted); margin-left: 24px; white-space: nowrap; }

/* dicas do controle */
.hints { padding-top: 20px; display: flex; align-items: center; font-size: 20px; color: var(--muted); }
.hint { display: flex; align-items: center; margin-right: 40px; }
.shortcut { margin-left: auto; height: 60px; padding: 0 24px 0 18px; display: flex; align-items: center; font-size: 22px; font-weight: 500; border-radius: 18px; }
.shortcut svg { width: 30px; height: 30px; margin-right: 12px; fill: var(--muted); }
.shortcut.is-focused svg { fill: var(--text); }
.key { display: inline-block; height: 38px; line-height: 34px; padding: 0 12px; margin-right: 12px; border: 2px solid var(--line); border-radius: 10px; box-sizing: border-box; font-family: var(--font-mono); font-size: 16px; color: var(--text); }

/* configurações */
.set-head { display: flex; align-items: center; margin-bottom: 8px; }
.set-back { width: 64px; height: 64px; margin-right: 20px; display: flex; align-items: center; justify-content: center; border-radius: 18px; flex-shrink: 0; }
.set-back svg { width: 34px; height: 34px; fill: var(--muted); }
.set-back.is-focused { transform: scale(1.06); -webkit-transform: scale(1.06); }
.set-back.is-focused svg { fill: var(--text); }
.set-title { font-size: 44px; font-weight: 600; }
.set-sub { font-size: 21px; color: var(--muted); margin-left: 20px; }
.set-group { margin: 26px 0 12px 4px; }
.setting { height: 66px; padding: 0 24px 0 28px; margin-bottom: 8px; display: flex; align-items: center; border-radius: 18px; }
.setting.is-focused { transform: scale(1.01); -webkit-transform: scale(1.01); }
.set-name { flex: 1; font-size: 26px; }
.set-value { display: flex; align-items: center; font-size: 24px; color: var(--muted); }
.setting.is-focused .set-value { color: var(--text); }
.arrow { font-family: var(--font-mono); font-size: 22px; margin: 0 14px; opacity: 0; }
.setting.is-focused .arrow { opacity: .55; }
.setting.is-link .arrow { visibility: hidden; }
.bar { width: 180px; height: 8px; border-radius: 4px; background: var(--line); margin-right: 18px; position: relative; overflow: hidden; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--muted); }
.setting.is-focused .bar i { background: var(--text); }

/* aviso de abertura */
#toast {
  position: absolute; right: 112px; top: 84px;
  background: var(--text); color: var(--bg);
  font-size: 24px; font-weight: 600; padding: 18px 30px; border-radius: 16px;
  opacity: 0; transition: opacity .2s; -webkit-transition: opacity .2s;
  white-space: nowrap;
}
#toast.show { opacity: 1; }
#toast small { font-family: var(--font-mono); font-weight: 500; opacity: .55; margin-left: 12px; font-size: 18px; }

@media (prefers-reduced-motion: reduce) { .tile, #toast { transition: none; -webkit-transition: none; } }
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div class="side">
      <div class="greeting" id="greeting">Boa noite, Pedro</div>
      <div class="clock" id="clock">20:00</div>
      <div class="date" id="date">sábado, 18 de outubro</div>

      <div class="now is-idle" id="now">
        <div class="now-head">
          <span class="label">Agora</span>
          <span class="now-state"><span class="dot" id="now-dot"></span><span id="now-state">Nada aberto</span></span>
        </div>
        <div class="now-body">
          <div class="cover" id="now-cover-box"><div class="cover-letter" id="now-letter">–</div><img id="now-cover" alt="" hidden></div>
          <div>
            <div class="now-title" id="now-title">Nenhum jogo aberto</div>
            <div class="now-meta" id="now-meta">O jogo do PS5 aparece aqui</div>
          </div>
        </div>
      </div>
    </div>

    <div class="main" id="home">
      <div class="group">
        <div class="label">Assistir</div>
        <div class="apps" id="row-apps"></div>
      </div>

      <div class="group inputs-group">
        <div class="label">Entradas</div>
        <div class="scroll" id="inputs-box"><div class="scroll-inner" id="row-inputs"></div></div>
      </div>

      <div class="hints">
        <div class="hint"><span class="key">◀ ▲ ▼ ▶</span>navegar</div>
        <div class="hint"><span class="key">OK</span>abrir</div>
        <div class="hint" id="hint-sim" hidden><span class="key">1–6</span>simular</div>
        <div id="row-system"></div>
      </div>
    </div>

    <div class="main" id="settings" hidden>
      <div class="set-head"><div class="tile set-back" id="set-back"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></div><span class="set-title">Configurações</span><span class="set-sub" id="set-sub"></span></div>
      <div class="scroll" id="set-box"><div class="scroll-inner" id="set-list"></div></div>
      <div class="hints">
        <div class="hint"><span class="key">▲ ▼</span>navegar</div>
        <div class="hint"><span class="key">◀ ▶</span>mudar</div>
        <div class="hint"><span class="key">VOLTAR</span>sair</div>
      </div>
    </div>

    <div id="toast"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var ROWS = [
    {
      el: 'row-apps',
      items: [] // preenchida por setApps com os apps instalados
    },
    {
      el: 'row-inputs',
      items: [
        { id: 'com.webos.app.hdmi1', name: 'HDMI 1', css: 'input', input: 'HDMI_1' },
        { id: 'com.webos.app.hdmi2', name: 'HDMI 2', css: 'input', input: 'HDMI_2' },
        { id: 'com.webos.app.hdmi3', name: 'HDMI 3', css: 'input', input: 'HDMI_3' },
        { id: 'com.webos.app.photovideo', name: 'USB 1', css: 'input', usb: 1 },
        { id: 'com.webos.app.photovideo', name: 'USB 2', css: 'input', usb: 2 }
      ]
    },
    {
      el: 'row-system',
      items: [
        { id: 'settings', name: 'Configurações', css: 'shortcut', action: 'settings' }
      ]
    },
    {
      el: 'now', // o painel "Agora" já existe no HTML; OK nele volta para o que estava aberto
      fixed: true,
      items: [
        { id: 'now', name: 'Agora', action: 'resume' }
      ]
    }
  ];

  var GEAR = '<svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.47.47 0 0 0-.47.41l-.36 2.54a7.4 7.4 0 0 0-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.47.47 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54a7 7 0 0 0 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.48.48 0 0 0-.12-.61zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/></svg>';

  // --- apps ---
  // Cada app instalado pela loja da LG ou pelo Homebrew vira um card, até MAX_CARDS contando
  // a Loja, que fica sempre por último. Os de KNOWN vêm primeiro, na ordem da lista;
  // os outros seguem pela data de instalação. Dá para esconder qualquer um em Configurações.
  var MAX_CARDS = 8;
  var USER_APP_DIR = /^\/media\/(cryptofs|developer)\/apps\//;
  var STORE = { id: 'org.webosbrew.hbchannel', name: 'Loja', kind: 'Homebrew Channel', css: 'app', mark: 'store', glyph: '+' };
  var NOT_CARDS = { 'com.pedrorenan.launcher': true, 'org.webosbrew.hbchannel': true };
  // Visual próprio para os apps de sempre; testado contra "id título" do app.
  var KNOWN = [
    { match: /^netflix /, kind: 'Filmes e séries', mark: 'netflix', glyph: 'N' },
    { match: /globoplay/i, kind: 'Novelas e TV Globo', mark: 'globoplay', glyph: 'g' },
    { match: /crunchyroll/i, kind: 'Anime', mark: 'crunchyroll', glyph: 'C' },
    { match: /prime video|^amazon /i, kind: 'Filmes e séries' },
    { match: /youtube/i, kind: 'Vídeos' }
  ];
  var PREFERRED = 3; // os 3 primeiros de KNOWN abrem a lista nessa ordem

  var hiddenApps = {}; // { appId: true } escondidos em Configurações
  try { hiddenApps = JSON.parse(localStorage.getItem('launcher.hiddenApps')) || {}; } catch (e) {}
  var userApps = []; // todos os apps instalados que podem virar card, já ordenados
  var rawApps = null; // última resposta do listApps

  // Aparelhos reconhecidos nas entradas. O teste roda sobre os textos que a TV informa
  // da porta (nome CEC, rótulo, fabricante), ex.: "PS5", "Xbox Series X", "NintendoSwitch".
  var DEVICES = [
    { key: 'playstation', label: 'PlayStation', match: /playstation|\bps[345]\b|\bsie\b/i },
    { key: 'xbox', label: 'Xbox', match: /xbox/i },
    { key: 'nintendo', label: 'Nintendo Switch', match: /nintendo|switch/i }
  ];

  // Aparelho escolhido à mão em Configurações, para quando a TV não identifica sozinha.
  // Ex.: { HDMI_2: 'xbox' }; 'other' = aparelho sem logo conhecido.
  var OVERRIDES = {};
  try { OVERRIDES = JSON.parse(localStorage.getItem('launcher.devices')) || {}; } catch (e) {}

  function logoUrl(key) { return 'img/devices/' + (key || 'default') + '.svg'; }

  var NAME = 'Pedro'; // nome na saudação
  var KEY = { LEFT: 37, UP: 38, RIGHT: 39, DOWN: 40, ENTER: 13, BACK: 461 };
  var MONTHS = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  var DAYS = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];

  var onTV = typeof window.PalmServiceBridge !== 'undefined';
  var focus = { row: 0, col: 0 };
  var lastCol = []; // última coluna focada em cada linha
  var tiles = []; // tiles[row][col] -> elemento

  function $(id) { return document.getElementById(id); }
  function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }

  function build() {
    for (var r = 0; r < ROWS.length; r++) {
      var rowEl = $(ROWS[r].el);
      if (ROWS[r].fixed) {
        tiles[r] = [rowEl];
        if (!rowEl.getAttribute('data-row')) {
          rowEl.setAttribute('data-row', r);
          rowEl.setAttribute('data-col', 0);
          rowEl.addEventListener('mouseenter', onHover);
          rowEl.addEventListener('click', onClick);
        }
        continue;
      }
      rowEl.innerHTML = '';
      tiles[r] = [];
      for (var c = 0; c < ROWS[r].items.length; c++) {
        var item = ROWS[r].items[c];
        var el = document.createElement('div');
        el.className = 'tile ' + item.css;
        el.setAttribute('tabindex', '-1');
        el.setAttribute('data-row', r);
        el.setAttribute('data-col', c);
        el.innerHTML = item.action ? GEAR + item.name
          : item.input || item.usb
          ? '<img class="device-logo" alt=""><div class="input-text"><div class="kind"></div><div class="name">' + item.name + '</div></div>' +
            '<div class="status"><span class="dot"></span><span class="status-text"></span></div>'
          : '<div class="mark' + (item.mark ? ' mark-' + item.mark : '') + '"' + (item.color ? ' style="background:' + item.color + '"' : '') + '>' + esc(item.glyph) +
            (item.icon ? '<img alt="" src="' + esc(item.icon) + '">' : '') + '</div>' +
            '<div><div class="name">' + esc(item.name) + '</div><div class="kind">' + esc(item.kind) + '</div></div>';
        var icon = el.querySelector('.mark img');
        if (icon) icon.addEventListener('error', function () { this.parentNode.removeChild(this); });
        el.addEventListener('mouseenter', onHover);
        el.addEventListener('click', onClick);
        rowEl.appendChild(el);
        tiles[r][c] = el;
      }
    }
  }

  function setFocus(row, col) {
    var prev = tiles[focus.row] && tiles[focus.row][focus.col];
    if (prev) prev.className = prev.className.replace(' is-focused', '');
    focus.row = row;
    focus.col = col;
    lastCol[row] = col;
    tiles[row][col].className += ' is-focused';
    if (ROWS[row].el === 'row-inputs') scrollTo($('inputs-box'), $('row-inputs'), tiles[row][col]);
    try { localStorage.setItem('launcher.focus', row + ',' + col); } catch (e) {}
  }

  // Rola a área para deixar el visível, com uma folga para o anel de foco.
  function scrollTo(box, inner, el) {
    var top = 0;
    for (var n = el; n && n !== inner; n = n.offsetParent) top += n.offsetTop;
    var h = box.clientHeight, pad = 40, y = +inner.getAttribute('data-y') || 0;
    if (top - pad < y) y = top - pad;
    if (top + el.offsetHeight + pad > y + h) y = top + el.offsetHeight + pad - h;
    y = Math.max(0, Math.min(y, inner.offsetHeight - h + 12));
    inner.setAttribute('data-y', y);
    inner.style.transform = inner.style.webkitTransform = 'translateY(' + -y + 'px)';
  }

  // Foca o bloco salvo (ou o primeiro que existir), já que linhas podem ficar vazias.
  function restoreFocus(row, col) {
    if (tiles[row] && tiles[row].length) return setFocus(row, Math.min(col, tiles[row].length - 1));
    for (var r = 0; r < tiles.length; r++) if (tiles[r].length) return setFocus(r, 0);
  }

  function center(el) {
    var r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  // Navegação espacial: vai para o bloco mais próximo na direção da seta.
  // Ao trocar de linha, volta para o último bloco focado nela.
  function move(dx, dy) {
    var from = center(tiles[focus.row][focus.col]);
    var best = null, bestScore = Infinity;
    for (var r = 0; r < tiles.length; r++) {
      for (var c = 0; c < tiles[r].length; c++) {
        if (r === focus.row && c === focus.col) continue;
        if (tiles[r][c].className.indexOf('is-idle') >= 0) continue; // "Agora" vazio não recebe foco
        var to = center(tiles[r][c]);
        var main = dx ? (to.x - from.x) * dx : (to.y - from.y) * dy;
        if (main <= 1) continue;
        var cross = dx ? Math.abs(to.y - from.y) : Math.abs(to.x - from.x);
        var score = main + cross * 2;
        if (score < bestScore) { bestScore = score; best = { row: r, col: c }; }
      }
    }
    if (!best) return;
    if (best.row !== focus.row && lastCol[best.row] !== undefined && dy && ROWS[best.row].el === 'row-apps' && tiles[best.row].length <= 4) best.col = lastCol[best.row];
    setFocus(best.row, best.col);
  }

  function launch(item) {
    if (item.action === 'settings') return openSettings();
    if (item.action === 'resume') {
      var u = lastUsed && describeUsed(lastUsed);
      if (!u) return;
      item = { id: lastUsed.id, name: u.title };
    }
    if (item.usb && !usbAt(item.usb)) return toast('Nada conectado na ' + item.name);
    if (onTV) {
      var bridge = new window.PalmServiceBridge();
      bridge.onservicecallback = function (msg) {
        var res = {};
        try { res = JSON.parse(msg); } catch (e) {}

  function knownFor(app) {

    for (var i = 0; i < apps.length; i++) {
      var a = apps[i];

      if (NOT_CARDS[a.id] || a.visible === false || !USER_APP_DIR.test(a.folderPath || '')) continue;

        mark: known.mark, glyph: known.glyph || (a.title || a.id).charAt(0).toUpperCase(),
        icon: known.mark ? '' : iconPath(a), color: known.mark ? '' : a.iconColor,
        rank: k >= 0 && k < PREFERRED ? k : PREFERRED, installTime: a.installTime || 0

  function identify(dev) {
    if (OVERRIDES[dev.id]) return OVERRIDES[dev.id] === 'other' ? null : OVERRIDES[dev.id];

    for (var k in dev) if (typeof dev[k] === 'string') text += ' ' + dev[k];

  function relativeTime(at) {
    var now = new Date(), d = new Date(at);
    var min = Math.floor((now - d) / 60000);
    if (min < 2) return 'há pouco';
    if (min < 60) return 'há ' + min + ' min';
    var midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    if (at >= midnight) return 'há ' + Math.floor(min / 60) + ' h';
    if (at >= midnight - 86400000) return 'ontem às ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    return 'em ' + d.getDate() + ' de ' + MONTHS[d.getMonth()];

      return { verb: 'Assistindo', title: port, meta: ago(u.at), logo: logoUrl(null) };

    if (kb) name += ' · ' + (kb >= 1048576 ? Math.round(kb / 1048576) + ' GB' : Math.round(kb / 1024) + ' MB');

        el.className = 'tile setting' + (s.app ? ' is-link' : '');
        el.setAttribute('data-idx', setRows.length);
        el.innerHTML = '<span class="set-name">' + s.name + '</span><span class="set-value"><span class="arrow">◀</span>' +
          (s.range ? '<span class="bar"><i></i></span>' : '') + '<span class="set-text"></span><span class="arrow">▶</span></span>';
        el.addEventListener('mouseenter', onSettingHover);
        el.addEventListener('click', onSettingClick);
        setRows.push(s);
        setEls.push(el);
      }
      list.appendChild(el);
    }
  }

  function renderSettings() {
    for (var i = 0; i < setRows.length; i++) {
      var s = setRows[i], el = setEls[i], v = currentValue(s);
      var text = s.app ? 'Abrir' : v === undefined ? '…' : v === null ? 'Indisponível' : s.range ? v + '%' : optionLabel(s, v);
      if (s.appId && v === 'show' && !onHome(s.appId)) text = 'Sem espaço';
      el.querySelector('.set-text').textContent = text;
      if (s.range) el.querySelector('.bar i').style.width = (v ? +v : 0) + '%';
    }
  }

  // idx -1 é o botão de voltar, ao lado do título.
  function settingEl(idx) { return idx < 0 ? $('set-back') : setEls[idx]; }
  function setSettingFocus(idx) {
    var prev = settingEl(setFocusIdx);
    if (prev) prev.className = prev.className.replace(' is-focused', '');
    setFocusIdx = idx;
    settingEl(idx).className += ' is-focused';
    if (idx >= 0) scrollTo($('set-box'), $('set-list'), setEls[idx]);
  }

  // Lê da TV os valores de cada categoria usada na tela.
  function loadSettings() {
    var byCat = {};
    for (var i = 0; i < setRows.length; i++) {
      var s = setRows[i];
      if (!s.category) continue;
      (byCat[s.category] = byCat[s.category] || []).push(s.key);
    }
    for (var cat in byCat) loadCategory(cat, byCat[cat]);
  }
  function loadCategory(cat, keys) {
    lunaCall('luna://com.webos.settingsservice/getSystemSettings', { category: cat, keys: keys }, function (res) {
      for (var i = 0; i < keys.length; i++) {
        var v = res.settings && res.settings[keys[i]];
        setValues[cat + '.' + keys[i]] = v === undefined ? null : '' + v;
      }
      if (cat === 'picture' && res.dimension && res.dimension.input) $('set-sub').textContent = 'Imagem da entrada ' + res.dimension.input.toUpperCase();
      renderSettings();
    });
  }

  var saveTimers = {};
  function saveSetting(s, v) {
    if (s.device) {
      if (v) OVERRIDES[s.device] = v; else delete OVERRIDES[s.device];
      try { localStorage.setItem('launcher.devices', JSON.stringify(OVERRIDES)); } catch (e) {}
      renderInputs(lastDevices);
      return;
    }
    if (s.appId) {
      if (v === 'hide') hiddenApps[s.appId] = true; else delete hiddenApps[s.appId];
      try { localStorage.setItem('launcher.hiddenApps', JSON.stringify(hiddenApps)); } catch (e) {}
      if (rawApps) setApps(rawApps);
      return;
    }
    setValues[valueKey(s)] = v;
    if (!onTV) return;
    // O brilho muda a cada toque; espera o controle parar antes de gravar.
    clearTimeout(saveTimers[valueKey(s)]);
    saveTimers[valueKey(s)] = setTimeout(function () {
      var settings = {};
      settings[s.key] = v;
      lunaCall('luna://com.webos.settingsservice/setSystemSettings', { category: s.category, settings: settings }, function (res) {
        if (res.returnValue) return;
        toast('Não mudou ' + s.name.toLowerCase(), res.errorText || '');
        loadCategory(s.category, [s.key]);
      });
    }, s.range ? 350 : 0);
  }

  function changeSetting(dir) {
    if (setFocusIdx < 0) return;
    var s = setRows[setFocusIdx], v = currentValue(s);
    if (s.app || v === undefined || v === null) return;
    if (s.range) {
      var n = Math.max(s.range[0], Math.min(s.range[1], Math.round((+v + dir * s.range[2]) / s.range[2]) * s.range[2]));
      if (n === +v) return;
      v = '' + n;
    } else {
      var idx = -1;
      for (var i = 0; i < s.options.length; i++) if (s.options[i][0] === v) idx = i;
      idx = idx < 0 ? 0 : (idx + dir + s.options.length) % s.options.length;
      v = s.options[idx][0];
    }
    saveSetting(s, v);
    renderSettings();
  }

  function activateSetting() {
    if (setFocusIdx < 0) return closeSettings();
    var s = setRows[setFocusIdx];
    if (s.app) launch({ id: s.app, name: s.name });
    else changeSetting(1);
  }

  function openSettings() {
    settingsOpen = true;
    $('home').hidden = true;
    $('settings').hidden = false;
    buildSettings();
    $('set-list').setAttribute('data-y', 0);
    setSettingFocus(0);
    renderSettings();
    if (onTV) loadSettings();
  }

  function closeSettings() {
    settingsOpen = false;
    $('settings').hidden = true;
    $('home').hidden = false;
  }

  $('set-back').addEventListener('mouseenter', function () { setSettingFocus(-1); });
  $('set-back').addEventListener('click', closeSettings);

  function onSettingHover(e) { setSettingFocus(+e.currentTarget.getAttribute('data-idx')); }
  function onSettingClick(e) { onSettingHover(e); activateSetting(); }

  function onSettingsKey(e) {
    switch (e.keyCode) {
      case KEY.UP: if (setFocusIdx >= 0) setSettingFocus(setFocusIdx - 1); break;
      case KEY.DOWN: if (setFocusIdx < setEls.length - 1) setSettingFocus(setFocusIdx + 1); break;
      case KEY.LEFT: changeSetting(-1); break;
      case KEY.RIGHT: changeSetting(1); break;
      case KEY.ENTER: activateSetting(); break;
      case KEY.BACK: case 27: case 8: closeSettings(); break; // Esc e Backspace para a prévia
      default: return;
    }
    e.preventDefault();
  }

  var toastTimer;
  function toast(text, detail) {
    var el = $('toast');
    el.innerHTML = text + (detail ? '<small>' + detail + '</small>' : '');
    el.className = 'show';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = ''; }, 2200);
  }

  function onHover(e) {
    var el = e.currentTarget;
    setFocus(+el.getAttribute('data-row'), +el.getAttribute('data-col'));
  }

  function onClick(e) {
    onHover(e);
    launch(ROWS[focus.row].items[focus.col]);
  }

  document.addEventListener('keydown', function (e) {
    if (settingsOpen) return onSettingsKey(e);
    switch (e.keyCode) {
      case KEY.LEFT: move(-1, 0); break;
      case KEY.RIGHT: move(1, 0); break;
      case KEY.UP: move(0, -1); break;
      case KEY.DOWN: move(0, 1); break;
      case KEY.ENTER: launch(ROWS[focus.row].items[focus.col]); break;
      case KEY.BACK: break; // o launcher é a raiz: Voltar não faz nada
      case 49: case 50: case 51:
        if (onTV) return;
        var p = e.keyCode - 49;
        simState[p] = (simState[p] + 1) % SIM_CYCLE.length;
        renderSim();
        break;
      case 54: // 6: troca o que o painel "Agora" mostra
        if (onTV) return;
        simUsed = (simUsed + 1) % SIM_USED.length;
        lastUsed = SIM_USED[simUsed] ? { id: SIM_USED[simUsed], at: Date.now() - 12 * 60000 } : null;
        renderInputs(lastDevices);
        break;
      case 52: case 53: // 4 e 5: liga/desliga um pendrive simulado na USB 1 / USB 2
        if (onTV) return;
        var port = e.keyCode - 51, list = [];
        simUsb[port] = !simUsb[port];
        if (simUsb[1]) list.push({ usbPortNum: 1, deviceType: 'USB', productName: 'Cruzer Blade', storageDriveList: [{ volumeLabel: 'FILMES', driveSize: 31260672 }] });
        if (simUsb[2]) list.push({ usbPortNum: 2, deviceType: 'USB', productName: 'USB DISK', storageDriveList: [{ volumeLabel: '', driveSize: 7811072 }] });
        renderUsb(list);
        break;
      default: return;
    }
    e.preventDefault();
  });

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function tick() {
    var d = new Date(), h = d.getHours();
    $('clock').textContent = pad(h) + ':' + pad(d.getMinutes());
    $('date').textContent = DAYS[d.getDay()] + ', ' + d.getDate() + ' de ' + MONTHS[d.getMonth()];
    $('greeting').textContent = (h >= 5 && h < 12 ? 'Bom dia' : h >= 12 && h < 18 ? 'Boa tarde' : 'Boa noite') + ', ' + NAME;
    if (tiles[1]) renderInputs(lastDevices); // atualiza os "há N min"
  }

  function fit() {
    var vp = $('viewport');
    var w = vp.clientWidth, h = vp.clientHeight;
    var s = Math.min(w / 1920, h / 1080);
    var t = 'translate(' + (w - 1920 * s) / 2 + 'px,' + (h - 1080 * s) / 2 + 'px) scale(' + s + ')';
    $('stage').style.transform = t;
    $('stage').style.webkitTransform = t;
  }

  $('now-cover').addEventListener('error', function () { this.hidden = true; });

  var saved = null;
  try { saved = (localStorage.getItem('launcher.focus') || '').split(','); } catch (e) {}
  if (saved && saved.length === 2) { focus.row = +saved[0]; focus.col = +saved[1]; }
  var cachedApps = null;
  try { cachedApps = JSON.parse(localStorage.getItem('launcher.apps')); } catch (e) {}
  setApps(onTV ? cachedApps || [] : SIM_APPS); // monta a tela; na TV, a lista certa chega logo depois
  if (onTV) {
    loadApps();
    document.addEventListener('visibilitychange', function () { if (!document.hidden) loadApps(); });
    watchUsb();
    watchInputs();
    watchForeground();
    pollPresence();
    setInterval(pollPresence, 60000);
    document.addEventListener('visibilitychange', pollPresence);
  } else {
    // exemplos para a prévia, sem gravar no navegador
    psGame = { name: 'Astro Bot', icon: null };
    persistLastOn = false;
    var yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1); yesterday.setHours(21, 40, 0, 0);
    lastOn = { HDMI_2: { key: 'nintendo', at: yesterday.getTime() } };
    lastUsed = { id: 'netflix', at: Date.now() - 12 * 60000 };
    renderSim();
    $('hint-sim').hidden = false;
  }
  tick();
  setInterval(tick, 20000);
  fit();
  window.addEventListener('resize', fit);
})();
</script>
</body>
</html>
